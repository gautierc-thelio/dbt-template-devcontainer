version: 2

models:
  - name: dp_sap_invoices__invoices_c2
    description: "A starter dbt model"
    config:
        enabled: true | false
        tags: <string> | [<string>]
        pre_hook: <sql-statement> | [<sql-statement>]
        post_hook: <sql-statement> | [<sql-statement>]
        database: <string>
        schema: c2
        alias: dp_sap_invoices__transform__invoices
        meta: {<dictionary>}
        grants: {<dictionary>}
        contract: {<dictionary>}
        event_time: my_time_field


    columns:
      - name: id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null
      - name: name
        description: "The name of the entity"
        data_tests:
          - not_null
      - name: created_at
        description: "The timestamp when the entity was created"
        data_tests:
          - not_null
          - accepted_values:
              values: ['2023-01-01', '2023-12-31']