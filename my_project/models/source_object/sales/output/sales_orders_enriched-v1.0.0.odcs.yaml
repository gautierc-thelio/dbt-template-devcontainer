    physicalName: sales_orders_enriched
    physicalType: table
    businessName: Enriched Sales Orders
    description: Final output table for enriched sales orders
    tags: ['sales', 'output']
    dataGranularityDescription: 1 row per order
    properties:
      - name: order_id
        logicalType: string
        primaryKey: true
        required: true
        description: Unique identifier for the order
        classification: internal
      - name: customer_id
        logicalType: string
        required: true
        description: Identifier of the customer
        classification: internal
      - name: order_date
        logicalType: date
        required: true
        description: Date when the order was placed
        classification: internal
      - name: order_status
        logicalType: string
        required: true
        description: Status of the order
        classification: internal
      - name: total_amount
        logicalType: number
        required: true
        description: Computed total amount of the order
        classification: internal
      - name: meta_ingestion_date
        logicalType: date
        required: true
        description: Date of ingestion into the system
        classification: internal

