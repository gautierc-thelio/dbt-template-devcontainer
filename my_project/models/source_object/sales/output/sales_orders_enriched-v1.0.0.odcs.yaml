description:
  purpose: Final output table for enriched sales orders
  usage: Used for internal sales reporting and analysis
  limitations: Contains only core sales metrics
  authoritativeDefinitions:
    - type: businessDefinition
      url: https://data.thalesgroup.com/catalog/sales_orders_enriched

servers:
  - server: duckdb-local
    type: duckdb
    host: localhost
    path: ./ec_dap.duckdb
